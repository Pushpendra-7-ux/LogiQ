name: logiq
description: "LogiQ — Reverse Auction System prototype (Flutter + SQLite, offline-first)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local persistence
  sqflite: ^2.4.1
  sqflite_common_ffi_web: ^0.4.5
  path: ^1.9.0

  # HTTP — prepared for future company REST API (not used by prototype flows yet)
  dio: ^5.7.0

  # Animations
  flutter_animate: ^4.5.2

  # Celebration effects
  confetti: ^0.8.0

  # Routing
  go_router: ^14.8.1

  # Date formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
